services:
  myapp-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: myapp-api-container

    ports:
      - "5269:8080"

    environment:
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS}
      Kafka__ApiKey: ${KAFKA_API_KEY}
      Kafka__ApiSecret: ${KAFKA_API_SECRET}
      Kafka__Topic: ${KAFKA_TOPIC}
      Kafka__GroupId: ${KAFKA_GROUP_ID}